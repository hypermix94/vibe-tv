plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.hypermix94.vibetv'
    compileSdk 34

    defaultConfig {
        applicationId 'io.github.hypermix94.vibetv'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'

        // The screensaver's weather place, from local.properties (never committed), e.g.
        //   stage.weatherPlace=London
        //   stage.weatherLatitude=51.5072
        //   stage.weatherLongitude=-0.1276
        // Left out: no weather.
        def local = new Properties()
        def localFile = rootProject.file('local.properties')
        if (localFile.exists()) localFile.withInputStream { local.load(it) }
        // The owner's name for the greeting, and the dock's apps (package names, comma-separated), e.g.
        //   stage.name=Alex
        //   stage.dock=com.netflix.ninja,com.google.android.youtube.tv
        resValue 'string', 'owner_name', local.getProperty('stage.name', local.getProperty('vibetv.name', ''))
        resValue 'string', 'dock_apps', local.getProperty('stage.dock', local.getProperty('vibetv.dock', ''))
        resValue 'string', 'weather_place', local.getProperty('stage.weatherPlace', local.getProperty('vibetv.weatherPlace', ''))
        resValue 'string', 'weather_latitude', local.getProperty('stage.weatherLatitude', local.getProperty('vibetv.weatherLatitude', ''))
        resValue 'string', 'weather_longitude', local.getProperty('stage.weatherLongitude', local.getProperty('vibetv.weatherLongitude', ''))
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Installed over ADB, not from a store: signed with the debug key.
            signingConfig signingConfigs.debug
        }
    }

    // Your own app logos, shown large on the home screen: local-logos/logos/<package>.jpg or .png, white or
    // coloured on black. Brands' logos are theirs, so the folder is never committed; without it, each app's banner.
    sourceSets.main.assets.srcDirs += rootProject.file('local-logos')

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
